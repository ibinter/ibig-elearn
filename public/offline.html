<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hors ligne — IBIG E-LEARN</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f9fafb;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: white;
      border-radius: 24px;
      padding: 40px 32px;
      text-align: center;
      max-width: 360px;
      width: 100%;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    }
    .icon {
      width: 72px; height: 72px;
      background: #FFF3CD;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 24px;
      font-size: 32px;
    }
    h1 { color: #0B3D91; font-size: 22px; margin-bottom: 12px; }
    p { color: #6b7280; font-size: 14px; line-height: 1.6; margin-bottom: 28px; }
    .btn {
      display: inline-block;
      background: #0B3D91;
      color: white;
      font-weight: 700;
      font-size: 14px;
      padding: 12px 28px;
      border-radius: 12px;
      text-decoration: none;
      transition: opacity .2s;
    }
    .btn:hover { opacity: .85; }
    .tip {
      margin-top: 24px;
      background: #EFF6FF;
      border-radius: 12px;
      padding: 16px;
      text-align: left;
    }
    .tip p { color: #1d4ed8; font-size: 13px; margin-bottom: 0; }
    .tip strong { display: block; margin-bottom: 4px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">📶</div>
    <h1>Vous êtes hors ligne</h1>
    <p>Vérifiez votre connexion Internet. Les leçons déjà consultées restent accessibles depuis votre cache.</p>
    <a href="/tableau-de-bord" class="btn" onclick="window.location.reload(); return false;">
      Réessayer
    </a>
    <div class="tip">
      <p><strong>💡 Astuce IBIG</strong>Consultez vos formations en Wi-Fi pour les mettre en cache et les lire ensuite sans connexion.</p>
    </div>
  </div>
</body>
</html>
